schema_version: 1
module:
  id: "<module-id>"
  package: "@afenda/<module-id>"
  path: "packages/erp/<module-id>"
  category: "<registered-category>"
  status: "proposed"
  criticality: "C1"
  activation_mode: "organization_toggle"
  admitted_capability: "<one coherent bounded-context capability>"
  non_ownership:
    - "<excluded concern>"
  owners:
    product: "<name>"
    package: "<name>"
    architecture: "<name>"
    security: "<name-or-null>"
    application: "<name-or-null>"
  authority:
    domain_architecture: "<path>"
    module_prd: "<path>"
    roadmap: "<path>"
    slices: "<path>"
  dependencies:
    required:
      - package: "@afenda/errors"
        reason: "canonical outcomes"
    optional_integrations: []
  mutation_table_prefixes:
    - "<prefix>"
  accepted_consumers:
    - "apps/web"
  public_exports:
    root: "."
    conditional:
      - path: "./adapters/drizzle"
        consumer: "application-composition"
      - path: "./testing"
        consumer: "tests"
  runtime_target: "node"
  features:
    - group: "<feature-group>"
      id: "<feature>"
      prd: "<path>"
  admission_decisions:
    ownership: "PASS"
    policy_neutrality: "PASS"
    boundary_coherence: "PASS"
    application_portability: "PASS"
