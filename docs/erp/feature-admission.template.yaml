schema_version: 1
feature:
  module_id: "<module-id>"
  feature_group: "<feature-group>"
  feature_id: "<feature>"
  backend_path: "packages/erp/<module-id>/src/features/<feature-group>/<feature>"
  business_mission: "<one bounded feature mission>"
  owner: "<name>"
  criticality: "C1"
  aggregates:
    - "<aggregate>"
  owned_terms:
    - "<term>"
  excluded_terms:
    - "<term>"
  operations:
    commands:
      - "<operation-id>"
    queries:
      - "<operation-id>"
  mutation_tables:
    - "<table>"
  permissions:
    - "<permission>"
  approval_policies:
    - "none"
  privacy_policies:
    - "<policy>"
  events:
    emits: []
    consumes: []
  ports: []
  web:
    required: true
    bucket: "operator"
    route: "/<route>"
    capsule_path: "apps/web/features/<module-id>/<feature-group>/<feature>"
    reads:
      - "<query-id>"
    mutations:
      - "<command-id>"
    client_islands: []
    acceptance:
      - "<observable user outcome>"
  applicability:
    persistence: true
    concurrency: true
    idempotency: true
    audit: true
    events: true
    web: true
